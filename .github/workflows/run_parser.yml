name: Daily Price Auto-Update

on:
  schedule:
    # Запуск каждый день в 3:00 ночи по Гринвичу (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Позволяет запускать робота вручную кнопкой в интерфейсе GitHub

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
    - name: Проверяем репозиторий
      uses: actions/checkout@v3

    - name: Устанавливаем Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Устанавливаем библиотеки
      run: |
        pip install requests beautifulsoup4

    - name: Запускаем парсер
      run: python parser.py

    - name: Сохраняем изменения и пушим на GitHub Pages
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add prices.json
        git diff-index --quiet HEAD || git commit -m "Авто-обновление цен [Skip CI]"
        git push
